[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "DTZ"]
# FastAPI deliberately declares Depends/File in endpoint defaults.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test environment variables must be set before importing the application.
"tests/conftest.py" = ["E402"]
